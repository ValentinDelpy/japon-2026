name: Build & publish

# GitHub Pages est configuré en « Deploy from a branch: main / (root) ».
# On publie donc le build Angular à la RACINE de la branche main.
# (On déclenche aussi le déploiement Actions pour couvrir ce mode.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Fallback SPA + .nojekyll
        run: |
          cp dist/ldva/browser/index.html dist/ldva/browser/404.html
          touch dist/ldva/browser/.nojekyll

      - name: Publier le build à la racine
        run: |
          cd "$GITHUB_WORKSPACE"
          # nettoyer les anciens artefacts (bundles hachés) avant de recopier
          rm -f main-*.js polyfills-*.js chunk-*.js styles-*.css 3rdpartylicenses.txt \
                ngsw.json ngsw-worker.js manifest.webmanifest favicon.ico 404.html .nojekyll index.html
          rm -rf icons
          cp -rf dist/ldva/browser/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish build [skip ci]" || echo "Rien à publier"
          git push

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ldva/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
